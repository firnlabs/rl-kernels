[project]
name = "rl-kernels"
version = "0.1.0"
description = "Triton kernels for reinforcement learning"
readme = "README.md"
authors = [
    { name = "Carlos Ezequiel", email = "carlos@firnresearch.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beartype>=0.22.9",
    "jaxtyping>=0.3.11",
    "numpy>=2.5.3",
    "torch>=2.14.0",
    "triton",
    "triton-msl>=0.2.0 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "commitizen>=4.16.5",
    "coverage-threshold>=0.6.2",
    "docformatter>=1.7.8",
    "pydoclint>=0.9.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.20",
    "ty>=0.0.58",
]
benchmark = [
    "matplotlib>=3.11.0",
    "pandas>=3.0.5",
    "tqdm>=4.68.4",
    "typer>=0.27.2",
]

[tool.uv.sources]
triton = [
    { url = "https://github.com/bledden/triton-msl/releases/download/triton-wheel-3.7.0-cp314-macos-arm64/triton-3.7.0+git4da2e268-cp314-cp314-macosx_15_0_arm64.whl", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=rl_kernels --cov-report=term-missing --cov-report=html --cov-report=json --import-mode=importlib"
pythonpath = ["."]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "raise AssertionError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E",  # PEP8 errors
    "W",  # PEP8 warnings
    "F",  # Pyflakes
    "I",  # Isort
    "B",  # flake-bugbear
    "D",  # pydocstyle rules
]
ignore = [
    "D1",    # Ignore missing docstrings
    "D203",  # Conflict with D211
    "F722",  # Conflict with jaxtyping `Float[Tensor, ""]`
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
order-by-type = false
known-first-party = ["rl_kernels"]

[tool.docformatter]
wrap-summaries = 88
wrap-descriptions = 88
pre-summary-newline = false
make-summary-multi-line = false

[tool.pydoclint]
style = "google"
allow-init-docstring = true
arg-type-hints-in-docstring = false
arg-type-hints-in-signature = true
skip-checking-private-functions = true
check-return-types = false
check-yield-types = false


[tool.ty.environment]
python-version = "3.14"

[tool.ty.rules]
invalid-method-override = "ignore"
blanket-ignore-comment = "warn"
missing-type-argument = "warn"
unused-ignore-comment = "ignore"
unused-type-ignore-comment = "warn"


[tool.coverage-threshold]
line_coverage_min = 80
file_line_coverage_min = 80

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "pep621"
update_changelog_on_bump = true
message_length_limit = 50
